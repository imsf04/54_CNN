[project]
name = "price-trends-cnn"
version = "0.1.0"
description = "CNN replication scaffold for (Re-)Imag(in)ing Price Trends"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=12.0",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "matplotlib>=3.8",
  "nbformat>=5.9",
]

[dependency-groups]
dev = [
  "pytest>=7.0",
  "ruff>=0.8",
  "jupyter>=1.0",
]

[tool.uv]
package = false

# Tsinghua is the default index. Aliyun remains available as an explicit fallback.
[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts", "tests"]
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
