name: Build report PDF

on:
  pull_request:
    branches: [main]
    paths:
      - 'reports/**/*.tex'
      - 'reports/figures/**'
      - '.github/workflows/build-report.yml'
  push:
    branches: [main]
    paths:
      - 'reports/**/*.tex'
      - 'reports/figures/**'
      - '.github/workflows/build-report.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Compile replication report
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          working_directory: reports
          root_file: replication_report.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode -outdir=build

      - name: Upload report PDF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: reports/build/replication_report.pdf
          archive: false
          if-no-files-found: error
